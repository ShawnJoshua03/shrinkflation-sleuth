[project]
name = "shrinkflation-sleuth"
version = "1.0.0"
description = "AI agent that detects grocery shrinkflation with Gemini, Google ADK and Elasticsearch"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "_site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Seed table rows are intentionally one record per line.
"data/scripts/data_pipeline.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Both come from inside google-adk, not this code.
filterwarnings = [
    'ignore:\[EXPERIMENTAL\]:UserWarning',
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
]
